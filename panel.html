<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RVC · 实时变声控制台</title>
<style>
:root{--ink:#111;--paper:#F2EFE9;--red:#DA291C}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--paper);color:var(--ink);
  font-family:"Inter","Neue Haas Grotesk","Helvetica Neue",Helvetica,Arial,"Noto Sans SC",sans-serif;
  font-weight:400;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
  padding:40px 36px 72px;
}
.wrap{max-width:1200px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(12,1fr);column-gap:22px;row-gap:10px}

/* ── 报头 ── */
.masthead{border-bottom:2px solid var(--ink);padding-bottom:24px}
.kicker{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--red)}
h1{margin-top:12px;font-size:clamp(40px,7vw,94px);font-weight:700;line-height:.92;letter-spacing:-.025em}
.meta{font-size:10px;line-height:2;letter-spacing:.09em;text-transform:uppercase}
.meta b{font-weight:700}

/* ── 区块 ── */
.sec{border-top:1px solid var(--ink);padding-top:14px;margin-top:44px}
.num{font-size:11px;font-weight:700;letter-spacing:.1em}
h2{font-size:15px;font-weight:700;letter-spacing:.02em;margin-top:3px}
.hint{font-size:11px;line-height:1.7;margin-top:9px;max-width:24ch}
.fields{display:grid;grid-template-columns:repeat(3,1fr);column-gap:22px;row-gap:26px}
.lb{display:block;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:1px}
input,select{
  display:block;width:100%;background:transparent;border:0;border-bottom:1px solid var(--ink);
  border-radius:0;color:var(--ink);font-family:inherit;padding:5px 0 6px;
  font-size:20px;font-weight:700;letter-spacing:-.01em;appearance:none;outline:none;
}
select{font-size:15px}
input:focus,select:focus{border-bottom-color:var(--red)}

/* ── 操作 ── */
.actions{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
button{
  font-family:inherit;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  padding:15px 24px;border:1px solid var(--ink);background:transparent;color:var(--ink);
  border-radius:0;cursor:pointer;
}
button.primary{background:var(--red);border-color:var(--red);color:#fff}
button.primary:active{background:var(--ink);border-color:var(--ink)}
.status{margin-left:auto;display:flex;align-items:center;gap:9px;
  font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.sq{width:10px;height:10px;background:var(--ink);display:inline-block}
.sq.on{background:var(--red)}

footer{border-top:1px solid var(--ink);margin-top:56px;padding-top:12px;
  font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  display:flex;justify-content:space-between;gap:20px}

@media(max-width:880px){
  body{padding:26px 20px 56px}
  .fields{grid-template-columns:repeat(2,1fr)}
  .sec .num,.sec h2,.sec .hint{grid-column:1/13}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="grid masthead">
    <div style="grid-column:1/9">
      <div class="kicker">RVC · Remote Control</div>
      <h1>实时变声<br>控制台</h1>
    </div>
    <div class="meta" style="grid-column:10/13">
      <div>引擎 <b>原版 realtime_gui</b></div>
      <div>接口 <b>127.0.0.1:8898</b></div>
      <div>2026 · 本地</div>
    </div>
  </header>

  <section class="grid sec">
    <div style="grid-column:1/4">
      <div class="num">01</div>
      <h2>音频设备</h2>
      <p class="hint">宿主 API 与输入／输出端点。改动后需重新开始才生效。</p>
    </div>
    <div class="fields" style="grid-column:4/13">
      <label><span class="lb">设备类型</span><select id="sg_hostapi"></select></label>
      <label><span class="lb">输入</span><select id="sg_input_device"></select></label>
      <label><span class="lb">输出</span><select id="sg_output_device"></select></label>
    </div>
  </section>

  <section class="grid sec">
    <div style="grid-column:1/4">
      <div class="num">02</div>
      <h2>声音参数</h2>
      <p class="hint">音调、声线、检索与响度。</p>
    </div>
    <div class="fields" style="grid-column:4/13">
      <label><span class="lb">响应阈值 / dB</span><input id="threhold" type="number" step="1"></label>
      <label><span class="lb">音调 / 半音</span><input id="pitch" type="number" step="1"></label>
      <label><span class="lb">性别因子</span><input id="formant" type="number" step="0.05"></label>
      <label><span class="lb">检索特征占比</span><input id="index_rate" type="number" step="0.01"></label>
      <label><span class="lb">响度因子</span><input id="rms_mix_rate" type="number" step="0.01"></label>
      <label><span class="lb">f0 算法</span><select id="f0method">
        <option>rmvpe</option><option>pm</option><option>fcpe</option></select></label>
    </div>
  </section>

  <section class="grid sec">
    <div style="grid-column:1/4">
      <div class="num">03</div>
      <h2>引擎节奏</h2>
      <p class="hint">采样长度决定延迟；额外推理时长决定上下文与算力消耗。</p>
    </div>
    <div class="fields" style="grid-column:4/13">
      <label><span class="lb">采样长度 / 秒</span><input id="block_time" type="number" step="0.01"></label>
      <label><span class="lb">淡入淡出 / 秒</span><input id="crossfade_length" type="number" step="0.01"></label>
      <label><span class="lb">额外推理时长 / 秒</span><input id="extra_time" type="number" step="0.5"></label>
    </div>
  </section>

  <section class="grid sec">
    <div style="grid-column:1/4">
      <div class="num">04</div>
      <h2>运行</h2>
      <p class="hint">应用后立即重新开始，相当于在原界面按一次「开始」。</p>
    </div>
    <div style="grid-column:4/13">
      <div class="actions">
        <button class="primary" id="apply">应用并开始</button>
        <button id="stop">停止</button>
        <div class="status"><span class="sq" id="dot"></span><span id="st">读取中</span></div>
      </div>
    </div>
  </section>

  <footer>
    <span>RVC · Realtime Voice Conversion</span>
    <span>2026 · 本地遥控面板</span>
  </footer>
</div>

<script>
const $ = id => document.getElementById(id);
const NUM = ["threhold","pitch","formant","index_rate","rms_mix_rate",
             "block_time","crossfade_length","extra_time"];

async function load(){
  try{
    const s = await (await fetch('/api/state')).json();
    NUM.forEach(k => { if(s[k] !== null && s[k] !== undefined) $(k).value = s[k]; });
    if(s.f0method) $("f0method").value = s.f0method;
    if(!$("sg_hostapi").dataset.filled){
      const dv = await (await fetch('/api/devices')).json();
      const apis = [...new Set(dv.devices.map(d => d.api))];
      $("sg_hostapi").innerHTML = apis.map(a => `<option>${a}</option>`).join("");
      fill("sg_input_device",  dv.devices.filter(d => d.io.includes("in")),  s.sg_input_device);
      fill("sg_output_device", dv.devices.filter(d => d.io.includes("out")), s.sg_output_device);
      ["sg_hostapi","sg_input_device","sg_output_device"].forEach(i => $(i).dataset.filled = "1");
    }
    const on = !!s.streaming;
    $("dot").className = "sq" + (on ? " on" : "");
    $("st").textContent = on ? "运行中" : "已停止";
  }catch(e){
    $("st").textContent = "未连接";
  }
}
function fill(id, list, cur){
  const sel = $(id);
  sel.innerHTML = list.map(d => `<option value="${d.name}">${d.name} · ${d.api}</option>`).join("");
  if(cur) sel.value = cur;
}
$("apply").onclick = async () => {
  const body = { sg_hostapi: $("sg_hostapi").value,
                 sg_input_device: $("sg_input_device").value,
                 sg_output_device: $("sg_output_device").value,
                 f0method: $("f0method").value };
  NUM.forEach(k => body[k] = parseFloat($(k).value));
  $("st").textContent = "已下发";
  await fetch('/api/apply', {method:'POST', headers:{'Content-Type':'application/json'},
                             body: JSON.stringify(body)});
  setTimeout(load, 2000);
};
$("stop").onclick = async () => {
  await fetch('/api/stop', {method:'POST'});
  setTimeout(load, 800);
};
load();
setInterval(load, 4000);
</script>
</body>
</html>
